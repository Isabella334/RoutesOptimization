[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/data",
  "src/domain",
  "src/infrastructure",
  "src/presentation",
  "src/use_cases",
]

[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.136.1",
    "firebase-admin>=6.5.0",
    "functions-framework>=3.10.1",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "uvicorn>=0.47.0",
]

[dependency-groups]
dev = [
    "dotenv>=0.9.9",
    "httpx>=0.27.0",
    "pytest>=9.0.3",
    "requests>=2.34.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.pyright]
pythonPath = "src"

